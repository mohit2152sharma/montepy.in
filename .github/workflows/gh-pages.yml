name: Website Deployment

on:
  push:
    paths-ignore:
      - "images/**"
      - "LICENSE"
      - "README.md"
    branches:
      - main
  # Build and test pull requests (including Dependabot updates); no deploy.
  pull_request:
  workflow_dispatch:
    # manual run
    inputs:
      hugoVersion:
        description: "Hugo Version"
        required: false
        default: "0.170.0"

# One run per branch or PR. On PR branches a newer push cancels the older
# run; on main, runs wait so that a deploy is never cut off.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Default to bash
defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    env:
      # Manual runs can choose another version; all other runs use this one.
      HUGO_VERSION: ${{ github.event.inputs.hugoVersion || '0.170.0' }}
      # production build: never publish drafts (config.yml keeps them on for local dev)
      HUGO_BUILDDRAFTS: false
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The theme is pinned to the commit recorded in this repo.
          # Dependabot proposes theme updates as pull requests.
          submodules: recursive
      - name: Build with Hugo
        # The site URL comes from baseURL in config.yml.
        run: hugo build --gc --logLevel info
      - name: Test the built site
        run: SITE_DIR=public python3 -m unittest discover -s tests -v
      - name: Upload artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public
  # Deployment job: only from main
  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    # Never cancel a deployment that has started.
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
