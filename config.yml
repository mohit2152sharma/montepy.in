baseURL: "https://montepy.in/" # CI passes the GitHub Pages URL with --baseURL
title: Monte's Snippets
pagination:
  pagerSize: 5
theme: PaperMod

enableRobotsTXT: true
buildDrafts: true # overridden in CI via HUGO_BUILDDRAFTS=false
buildFuture: true
# buildExpired: false

googleAnalytics: G-1JKCGP13SR

minify:
  disableXML: true
  minifyOutput: true

params:
  env: production # to enable google analytics, opengraph, twitter-cards and schema.
  title: Monte's Snippets
  # Home page meta description, and the fallback for pages without their own.
  description: "Monte's Snippets, a dev journal: hands-on notes from the field on building real-time voice agents, LLMs, and systems."
  keywords: [python, shell, git, llm, voice ai]
  author: Mohit Sharma
  DateFormat: "January 2, 2006"
  defaultTheme: auto # dark, light
  disableThemeToggle: false

  ShowReadingTime: true
  ShowShareButtons: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowWordCount: true
  ShowRssButtonInSectionTermList: true
  UseHugoToc: true
  disableSpecial1stPost: false
  disableScrollToTop: false
  comments: false
  hidemeta: false
  hideSummary: false
  showtoc: false
  tocopen: false

  # social:
  # Each profile URL is written once (&anchor) and reused (*alias) in
  # schema.sameAs below, so the footer icons and the JSON-LD cannot drift.
  socialIcons:
    # - name: stackoverflow
    #   url: "https://stackoverflow.com/users/8547986/monte"
    - name: email
      url: "mailto:mohitsharma@alumni.iitm.ac.in"
    - name: github
      url: &github "https://github.com/mohit2152sharma"
    # - name: youtube
    #   url: "https://www.youtube.com/channel/UChZfYRQRGADaLtgdYaB0YBg"
    - name: x
      url: &x "https://x.com/data_question"
    - name: linkedin
      url: &linkedin "https://www.linkedin.com/in/mohit-sharma-82030487/"
    # - name: rss
  # - name: paypal
  #   url: "https://paypal.me/mohit2013?country.x=IN&locale.x=en_GB"

  # JSON-LD Organization (home page). sameAs must hold only profile URLs,
  # so it lists the social profiles without the mailto: link.
  schema:
    publisherType: Organization
    sameAs: [*github, *x, *linkedin]

  assets:
    # disableHLJS: true # to disable highlight.js
    # disableFingerprinting: true
    # Icon files live in static/ (generated by scripts/make_icons.py).
    # The theme also uses `favicon` as the JSON-LD logo, so it must be a
    # raster image of at least 112 x 112 px. The other icons use the theme
    # defaults: favicon-16x16.png, favicon-32x32.png, apple-touch-icon.png
    # and safari-pinned-tab.svg.
    favicon: "logo-512.png"

  label:
    text: "Home"
    # Inline SVG, so the header needs no extra request and no <img alt>.
    # The polygon must match M in scripts/make_icons.py (a test checks it).
    iconSVG: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="35" height="35" aria-hidden="true" focusable="false"><rect width="100" height="100" rx="18" fill="#2e2e33"/><polygon points="20,78 20,22 33,22 50,49 67,22 80,22 80,78 67,78 67,44 50,70 33,44 33,78" fill="#fff"/></svg>'

  # profile-mode
  profileMode:
    enabled: false # needs to be explicitly set
    title: ExampleSite
    subtitle: "This is subtitle"
    imageUrl: "<img location>"
    imageWidth: 120
    imageHeight: 120
    imageTitle: my image
    buttons:
      - name: Posts
        url: posts
      - name: Tags
        url: tags

  # home-info mode
  homeInfoParams:
    Title: "Hi there \U0001F44B"
    Content: Welcome to my dev journal. I mostly write about python and machine learning stuff.

  cover:
    hidden: true # hide everywhere but not in structured data
    hiddenInList: true # hide on list pages and home
    hiddenInSingle: true # hide on single page

  editPost:
    URL: "https://github.com/mohit2152sharma/montepy.in/blob/main/content"
    Text: "Suggest Changes" # edit text
    appendFilePath: true # to append file path to Edit link

  # for search
  # https://fusejs.io/api/options.html
  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    keys: ["title", "permalink", "summary", "content"]
menu:
  main:
    - identifier: archives
      name: archives
      url: /archives/
      weight: 10
    - identifier: tags
      name: tags
      url: /tags/
      weight: 20
    - identifier: search
      name: search
      url: search/
      weight: 30

outputs:
  home:
    - HTML
    - RSS
    - JSON # necessary for search
    - llms # /llms.txt (template: layouts/_default/llms.txt)

# llms.txt: a plain-text index of the site for AI tools (https://llmstxt.org).
outputFormats:
  llms:
    baseName: llms
    mediaType: text/plain
    isPlainText: true
    notAlternative: true

# Read: https://github.com/adityatelange/hugo-PaperMod/wiki/FAQs#using-hugos-syntax-highlighter-chroma
pygmentsUseClasses: true
markup:
  highlight:
    noClasses: false
    anchorLineNos: false
    codeFences: true
    guessSyntax: true
    lineNos: false
    style: monokai
